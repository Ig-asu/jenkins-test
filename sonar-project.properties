# ключ проекта
sonar.projectKey=OtusExample

# имя проекта
sonar.projectName=OtusExample

# версия проекта
sonar.projectVersion=1.0

# путь к корню репозитория (coverage-отчёт и пути внутри XML — src/cf/...)
sonar.projectBaseDir=.

# маска поиска файлов на проверку
sonar.inclusions=src/cf/**/*.bsl,src/cf/**/*.os

# маска поиска исключений файлов на проверку
sonar.exclusions=**/*.html,**/*.xml,**/build/**,**/features/**
sonar.lang.patterns.xml=**/*.xsd,**/*.xsl

# кодировка
sonar.sourceEncoding=UTF-8

# BSL plugin на Sonar 25.9 требует Java 21 (scanner по умолчанию тянет JRE 17 с сервера)
sonar.scanner.skipJreProvisioning=true
sonar.scanner.javaExePath=C:\\Program Files\\BellSoft\\LibericaJDK-21\\bin\\java.exe
